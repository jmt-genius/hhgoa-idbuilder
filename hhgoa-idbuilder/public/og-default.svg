<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#052e16"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(34,197,94,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(34,197,94,0.15)"/>
      <stop offset="100%" stop-color="rgba(5,46,22,0)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="600" cy="315" r="180" fill="none" stroke="url(#ring)" stroke-width="8"/>
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <text x="600" y="280" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="48" font-weight="bold" fill="#e8f5e9">FRAME IN GOA</text>
  <text x="600" y="340" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="24" fill="#22c55e">Hacker House Goa 2026</text>
  <text x="600" y="420" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="rgba(34,197,94,0.6)">#FrameInGoa</text>
</svg>